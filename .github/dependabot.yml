version: 2
updates:
  - package-ecosystem: gomod
    directory: /sw/nic/gpuagent
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      go-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - security
  - package-ecosystem: docker
    directory: /tools/build-container
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - security
