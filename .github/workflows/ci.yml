name: CI Build

on:
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read Go version
        id: go-version
        run: |
          version=$(awk '$1 == "go" { print $2; exit }' sw/nic/gpuagent/go.mod)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compute third-party hash
        id: deps
        run: |
          hash=$(bash tools/build-container/deps-hash.sh)
          test -n "$hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "third-party hash: $hash"

      - name: Restore third-party sysroot cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: tools/build-container/prebuilt-deps/gpuagent-deps.tar.gz
          key: gpuagent-deps-rhel9-${{ steps.deps.outputs.hash }}

      - name: Build builder container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/build-container/Dockerfile.rhel9
          load: true
          target: ${{ steps.deps-cache.outputs.cache-hit == 'true' && 'with-prebuilt-deps' || 'with-deps' }}
          tags: |
            gpuagent-builder-rhel:9
            gpuagent-builder-rhel:9-${{ steps.deps.outputs.hash }}
          build-args: |
            GO_VERSION=${{ steps.go-version.outputs.version }}
            GPUAGENT_DEPS_HASH=${{ steps.deps.outputs.hash }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export third-party sysroot for cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/build-container/prebuilt-deps
          docker run --rm --entrypoint tar gpuagent-builder-rhel:9 \
            -C /opt -czf - gpuagent-deps \
            > tools/build-container/prebuilt-deps/gpuagent-deps.tar.gz

      - name: Build gpuagent
        id: build
        run: |
          # pipefail is on by default in Actions bash, so make's rc survives tee
          make gpuagent \
            GIT_COMMIT=$(git rev-list -1 HEAD --abbrev-commit) \
            BUILD_DATE=$(date +%Y-%m-%dT%H:%M:%S%z) \
            2>&1 | tee build.log

      - name: Scan gpuctl with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: sw/nic/build/x86_64/sim/bin/gpuctl
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-gpuctl

      - name: Build summary
        if: always()
        run: |
          BIN=sw/nic/build/x86_64/sim/bin
          {
            echo "## gpuagent build"
            echo ""
            echo "- status: **${{ steps.build.outcome }}**"
            echo "- commit: \`$(git rev-list -1 HEAD --abbrev-commit)\`"
            echo ""
            echo "| binary | size | sha256 |"
            echo "|---|---|---|"
            for b in gpuagent gpuagent_gim gpuagent_mock gpuctl; do
              if [ -f "$BIN/$b" ]; then
                sz=$(du -h "$BIN/$b" | cut -f1)
                sha=$(sha256sum "$BIN/$b" | cut -c1-12)
                echo "| $b | $sz | \`$sha\` |"
              else
                echo "| $b | — | **MISSING** |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gpuagent
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpuagent
          path: sw/nic/build/x86_64/sim/bin/gpuagent
          retention-days: 10
          if-no-files-found: warn

      - name: Upload gpuagent_gim
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpuagent_gim
          path: sw/nic/build/x86_64/sim/bin/gpuagent_gim
          retention-days: 10
          if-no-files-found: warn

      - name: Upload gpuagent_mock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpuagent_mock
          path: sw/nic/build/x86_64/sim/bin/gpuagent_mock
          retention-days: 10
          if-no-files-found: warn

      - name: Upload gpuctl
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpuctl
          path: sw/nic/build/x86_64/sim/bin/gpuctl
          retention-days: 10
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          retention-days: 10
          if-no-files-found: warn
